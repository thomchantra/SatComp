name: build

on:
  push:
    branches: [main]
    # v* = SatComp (and the whole-suite bundle release); <plugin>-v* = one sibling plug-in on its own release page
    tags: ["v*", "satxcomp-v*", "satlim-v*", "sateq-v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Linux build deps (baseview / egui)
        run: sudo apt-get update && sudo apt-get install -y libx11-xcb-dev libxcb-icccm4-dev libxcb-dri2-0-dev libgl1-mesa-dev libx11-dev libxcursor-dev libasound2-dev
      - name: Tests
        working-directory: rust
        run: cargo test --locked

  # which plug-ins this run bundles: a plain v* tag (and branch / PR builds) = every plug-in that exists in the workspace,
  # a <plugin>-v* tag = just that plug-in
  plan:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.p.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          case "$ref" in
            satxcomp-v*) list='["satxcomp"]' ;;
            satlim-v*)   list='["satlim"]' ;;
            sateq-v*)    list='["sateq"]' ;;
            *)
              list='["satcomp"'
              [ -d rust/satxcomp-plugin ] && list="$list,\"satxcomp\""
              [ -d rust/satlim-plugin ] && list="$list,\"satlim\""
              [ -d rust/sateq-plugin ] && list="$list,\"sateq\""
              list="$list]"
              ;;
          esac
          echo "plugins=$list" >> "$GITHUB_OUTPUT"
          echo "bundling: $list"

  bundle:
    needs: [test, plan]
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.plan.outputs.plugins) }}
        os: [macos-latest, windows-latest, ubuntu-22.04]
        include:
          - os: macos-latest
            name: macOS-universal
            sub: bundle-universal
          - os: windows-latest
            name: Windows-x64
            sub: bundle
          # built on 22.04 so it also runs on older distributions (glibc 2.35); experimental until someone confirms it
          - os: ubuntu-22.04
            name: Linux-x64
            sub: bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Linux build deps (baseview / egui)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-xcb-dev libxcb-icccm4-dev libxcb-dri2-0-dev libgl1-mesa-dev libx11-dev libxcursor-dev libasound2-dev
      - name: Bundle
        working-directory: rust
        run: cargo xtask ${{ matrix.sub }} ${{ matrix.plugin }} --release
      - name: Package
        shell: bash
        run: |
          # zip name = <Display>-<plug-in version from its Cargo.toml>-<platform>; the plug-in's own version, not the tag
          plugin="${{ matrix.plugin }}"
          case "$plugin" in satcomp) disp=SatComp ;; satxcomp) disp=SatXComp ;; satlim) disp=SatLim ;; sateq) disp=SatEQ ;; esac
          ver=$(grep -m1 '^version' "rust/${plugin}-plugin/Cargo.toml" | sed 's/.*"\(.*\)".*/\1/')
          # zip layout mirrors the install folders: VST3/<plugin>.vst3, CLAP/<plugin>.clap, INSTALL.txt, LICENSE (+ the manual on the macOS job)
          mkdir -p dist/VST3 dist/CLAP
          cp LICENSE dist/
          cp -R "rust/target/bundled/${plugin}.vst3" dist/VST3/
          cp -R "rust/target/bundled/${plugin}.clap" dist/CLAP/
          case "${{ matrix.name }}" in macOS*) os=macOS ;; Linux*) os=Linux ;; *) os=Windows ;; esac
          sed -e "s/@PLUGIN@/${plugin}/g" -e "s/@NAME@/${disp}/g" -e "s/@VER@/v${ver}/g" "docs/install/INSTALL-${os}.txt" > dist/INSTALL.txt
          if [ "$os" = Linux ]; then
            sed -e "s/@PLUGIN@/${plugin}/g" -e "s/@NAME@/${disp}/g" -e "s/@VER@/v${ver}/g" docs/install/install-linux.sh > dist/install.sh
            chmod +x dist/install.sh
          fi
          manual="docs/manual/${disp}-Manual-v${ver}.pdf"
          if [ -f "$manual" ]; then
            cp "$manual" dist/
            if [ "$os" = macOS ]; then cp "$manual" .; fi
          fi
          cd dist && 7z a -tzip "../${disp}-v${ver}-${{ matrix.name }}.zip" . || zip -r "../${disp}-v${ver}-${{ matrix.name }}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-${{ matrix.name }}
          path: |
            *.zip
            *.pdf

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.pdf
          # notes come from docs/releases/<tag>.md (falls back to generated notes when there is no file)
          body_path: ${{ hashFiles(format('docs/releases/{0}.md', github.ref_name)) != '' && format('docs/releases/{0}.md', github.ref_name) || '' }}
          generate_release_notes: ${{ !hashFiles(format('docs/releases/{0}.md', github.ref_name)) }}
