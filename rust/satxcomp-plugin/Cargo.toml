[package]
name = "satxcomp"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["vst3"] }
satcomp-dsp = { path = "../satcomp-dsp" }
satxcomp-dsp = { path = "../satxcomp-dsp" }
satcomp-ui = { path = "../satcomp-ui" }
nih_plug_egui = { path = "../vendor/nih_plug_egui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"

[features]
# `cargo run -p satxcomp --features standalone --bin satxcomp-standalone` opens the editor in a plain window (dev aid)
standalone = ["nih_plug/standalone"]

[[bin]]
name = "satxcomp-standalone"
path = "src/standalone.rs"
required-features = ["standalone"]
